  .id-chip { font-family:'JetBrains Mono',monospace; font-size:.66rem; color:var(--ink-soft);

             letter-spacing:.12em; white-space:nowrap; }
  .rows { display:flex; flex-direction:column; margin-top:16px; flex:1; }

  .row .v { font-size:.78rem; font-weight:600; text-align:right; color:var(--ink); }
  .row .v.lime { color:var(--lime-ink); }
  .row .v.cat { font-family:'Archivo',sans-serif; font-weight:800; }

  .hist { color:var(--ink-soft); font-size:.74rem; line-height:1.5; font-style:italic;

  .back-foot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:12px; }
  .source { font-family:'JetBrains Mono',monospace; font-size:.6rem; color:var(--muted);
